spring.datasource.url=jdbc:h2:file:C:/Users/Adrian/Desktop/trabajo/pa4-demo-db/pedidos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql
logging.level.org.springframework.jdbc.core=INFO

pedidos-reportes.api.base-url=http://localhost:8083/pedidos-reportes-service
pedidos-reportes.api.connect-timeout-ms=2000
pedidos-reportes.api.read-timeout-ms=3000

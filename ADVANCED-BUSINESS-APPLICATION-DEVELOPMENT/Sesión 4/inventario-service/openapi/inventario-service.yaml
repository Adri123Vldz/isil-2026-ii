openapi: 3.0.3
info:
  title: Inventario Service
  version: 1.4.0
  description: API académica responsable del catálogo de productos, precios y stock.
servers:
  - url: http://localhost:8082/inventario-service/api
paths:
  /inventario/productos:
    get:
      summary: Lista el catálogo completo con precio y stock
      responses:
        '200':
          description: Lista obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
  /inventario/productos/codigo/{codigo}:
    get:
      summary: Obtiene un producto por código de negocio
      parameters:
        - in: path
          name: codigo
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '404': { description: Producto no encontrado }
  /inventario/productos/codigo/{codigo}/reservas:
    post:
      summary: Reserva stock y devuelve el snapshot comercial del producto
      parameters:
        - in: path
          name: codigo
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaStockRequest'
      responses:
        '200':
          description: Stock reservado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaStockResponse'
        '400': { description: Datos inválidos }
        '404': { description: Producto no encontrado }
        '409': { description: Stock insuficiente o conflicto de concurrencia }
  /inventario/productos/codigo/{codigo}/devoluciones:
    post:
      summary: Devuelve stock; los identificadores permiten reintentos idempotentes
      parameters:
        - in: path
          name: codigo
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevolucionStockRequest'
      responses:
        '200':
          description: Stock devuelto o confirmación de una devolución previa con la misma operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolucionStockResponse'
        '400': { description: Cantidad inválida o identificadores incompletos }
        '404': { description: Producto no encontrado }
        '409': { description: El pedido ya fue compensado con datos diferentes }
components:
  schemas:
    ProductoResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        codigo: { type: string }
        nombre: { type: string }
        precio: { type: number, format: double }
        stock: { type: integer }
        version: { type: integer, format: int64 }
    ReservaStockRequest:
      type: object
      required: [cantidad]
      properties:
        cantidad:
          type: integer
          minimum: 1
    ReservaStockResponse:
      type: object
      properties:
        productoId: { type: integer, format: int64 }
        codigo: { type: string }
        nombre: { type: string }
        precio: { type: number, format: double }
        cantidadReservada: { type: integer }
        stockRestante: { type: integer }
        version: { type: integer, format: int64 }
    DevolucionStockRequest:
      type: object
      required: [cantidad]
      properties:
        pedidoId:
          type: integer
          format: int64
          minimum: 1
          description: Opcional para solicitudes simples; debe enviarse junto con operacionId para idempotencia.
        operacionId:
          type: string
          format: uuid
          description: UUID opcional, requerido junto con pedidoId para reintentos idempotentes.
        cantidad:
          type: integer
          minimum: 1
    DevolucionStockResponse:
      type: object
      properties:
        pedidoId: { type: integer, format: int64 }
        operacionId: { type: string, format: uuid }
        codigo: { type: string }
        cantidadDevuelta: { type: integer }
        stockRestante: { type: integer }
        stockResultante: { type: integer }
